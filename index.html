    height: 100dvh; max-height: 100dvh; width: 100vw;
    overflow: hidden !important;
    font-family: 'Gowun Dodum', sans-serif;
    background: #F0F7FF;
  }
  #root {
    width: 100%; height: 100dvh; max-height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ── 반응형 폰트 기준 (태블릿 기준) ── */
  :root { --base: 16px; }
  @media (max-width: 768px)  { :root { --base: 13px; } }
  @media (min-width: 1024px) { :root { --base: 17px; } }
  @media (min-width: 1280px) { :root { --base: 18px; } }

  /* ── 스크롤 방지 ── */
  .no-scroll { overflow: hidden !important; }

  /* ── 안전 높이 (태블릿 주소창 등) ── */
  .safe-h { height: 100dvh; max-height: 100dvh; }

  /* ── 그림자 유틸 ── */
  .puffy-shadow-orange { box-shadow: 0 8px 0 -2px rgba(234,88,12,0.25), 0 6px 20px -2px rgba(234,88,12,0.3) }
  .puffy-shadow-purple { box-shadow: 0 8px 0 -2px rgba(126,34,206,0.25), 0 6px 20px -2px rgba(126,34,206,0.3) }
  .puffy-shadow-blue   { box-shadow: 0 8px 0 -2px rgba(37,99,235,0.25),  0 6px 20px -2px rgba(37,99,235,0.3)  }
  .puffy-shadow-green  { box-shadow: 0 8px 0 -2px rgba(5,150,105,0.25),  0 6px 20px -2px rgba(5,150,105,0.3)  }
  .light-glow-red    { box-shadow: 0 0 20px rgba(239,68,68,0.6),  inset -4px -4px 12px rgba(0,0,0,0.2), inset 4px 4px 12px rgba(255,255,255,0.4) }
  .light-glow-yellow { box-shadow: 0 0 20px rgba(245,158,11,0.6), inset -4px -4px 12px rgba(0,0,0,0.2), inset 4px 4px 12px rgba(255,255,255,0.4) }
  .light-glow-green  { box-shadow: 0 0 20px rgba(16,185,129,0.6), inset -4px -4px 12px rgba(0,0,0,0.2), inset 4px 4px 12px rgba(255,255,255,0.4) }
  .light-dim         { opacity: 0.4; filter: saturate(0.5) }

  @keyframes sparkle { 0%,100% { transform: scale(0.8) rotate(0deg); opacity: 0.6 } 50% { transform: scale(1.2) rotate(180deg); opacity: 1 } }
  .sparkle { animation: sparkle 2s infinite }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .6 } }
  .animate-pulse { animation: pulse 1.5s infinite }

  /* ── Tailwind 보완: dvh 지원 ── */
  .h-screen-safe { height: 100dvh; }
</style>

<script>
// ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
// ★  GAS URL 설정 — 아래 줄의 따옴표 안에만 URL 입력  ★
// ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
// ── GAS URL 결정 (우선순위) ──────────────────────────
// 1) #c=<exec주소> 해시 (학생 링크) → localStorage 저장 없이 세션에서만 사용
// 2) localStorage에 저장된 선생님 주소
// 3) 데모 모드 (시트 미연결)
var _GAS_MODE = 'demo';   // 'hash' | 'local' | 'demo'
var GAS_URL = (function() {
    try {
        // 1) 해시 파라미터 #c=...
        var hash = window.location.hash || '';
        if (hash.indexOf('#c=') === 0) {
            var hUrl = decodeURIComponent(hash.slice(3));
            if (hUrl.indexOf('script.google.com') !== -1) {
                _GAS_MODE = 'hash';
                return hUrl;
            }
        }
        // 2) localStorage
        var saved = localStorage.getItem('gas_url');
        if (saved && saved.indexOf('script.google.com') !== -1) {
            _GAS_MODE = 'local';
            return saved;
        }
    } catch(e) {}
    _GAS_MODE = 'demo';
    return '';
})();

// 연동 여부 판별
function gasConnected() {
    return GAS_URL.indexOf('script.google.com') !== -1;
}
// 학생 링크 접속 여부 (해시 모드)
function isStudentLink() {
    return _GAS_MODE === 'hash';
}
// ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
</script>

// ── GAS 통신 ──
function gasGet(type, params) {
    if (!gasConnected()) return Promise.resolve({});
    return new Promise(function(resolve, reject) {
        var name = '__jsonp_' + Math.random().toString(36).slice(2);
        var url = GAS_URL + '?type=' + encodeURIComponent(type) + '&callback=' + name;
        if (params) {
            Object.keys(params).forEach(function(k) {
                url += '&' + k + '=' + encodeURIComponent(params[k]);
            });
        }
        var sc = document.createElement('script'); var done = false;
        function clean(){ try{delete window[name];}catch(e){window[name]=undefined;} if(sc&&sc.parentNode)sc.parentNode.removeChild(sc); }
        window[name] = function(d){ if(done)return; done=true; clean(); resolve(d); };
        sc.onerror = function(){ if(done)return; done=true; clean(); reject(new Error('응답을 읽을 수 없어요.')); };
        sc.src = url; document.head.appendChild(sc);
        setTimeout(function(){ if(!done){ done=true; clean(); reject(new Error('시간 초과')); } }, 12000);
    });
}
function gasPost(data) {
    if (!gasConnected()) {
        console.log('[데모 모드] 시트 저장 생략:', data.type || '');
        return Promise.resolve({ ok: false, demo: true });
    }
    return fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
    });
}

    function doConnect() {
        var trimmed = input.trim();

            setMsg('올바른 Apps Script 주소가 아니에요. .../exec 형태여야 해요.');
            setMsgType('error');
            return;

        try { localStorage.setItem('gas_url', trimmed); } catch(e) {}
        if (props.onConnect) props.onConnect(trimmed);

        _GAS_MODE = 'local';
        setMsg('연결됐어요! 아래 학생용 주소를 복사해 공유하세요.');

        setMsgType('info');

                        style: { fontFamily: 'monospace', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }

                    h("button", {

// ═══════════════════════════════════════════════
// 공용 컴포넌트 — 각 단계 상단 헤더
// (단계 전환 드롭다운 + 홈 버튼 + 우측 카운터 슬롯)
// ═══════════════════════════════════════════════
var STAGE_OPTIONS = [
    { key: 's1_1', label: '1단계  낱말 카드 모으기', bg: 'bg-amber-100', text: 'text-amber-700', border: 'border-amber-200', subLabels: {} },
    { key: 's1_2', label: '1단계  낱말 카드 모으기', bg: 'bg-amber-100', text: 'text-amber-700', border: 'border-amber-200', subLabels: {} },
    { key: 's2_1', label: '2단계  문장 만들기',       bg: 'bg-blue-100',  text: 'text-blue-700',  border: 'border-blue-200',  subLabels: {} },
    { key: 's2_2', label: '2단계  문장 만들기',       bg: 'bg-blue-100',  text: 'text-blue-700',  border: 'border-blue-200',  subLabels: {} },
    { key: 's3',   label: '3단계  일기쓰기',          bg: 'bg-emerald-100', text: 'text-emerald-700', border: 'border-emerald-200', subLabels: {} }
];

// ═══════════════════════════════════════════════
// 공용 튜토리얼 팝업 (처음 접속 시만 표시)
// ═══════════════════════════════════════════════
function Tutorial(props) {
    var steps = props.steps || [];
    var storageKey = props.storageKey || 'tutorial_done';
    var accentColor = props.accentColor || 'orange';
    var seen = false;
    try { seen = !!localStorage.getItem(storageKey); } catch(e) {}
    var sOpen = useState(!seen);
    var open = sOpen[0], setOpen = sOpen[1];
    var sStep = useState(0);
    var step = sStep[0], setStep = sStep[1];
    var sUserInput = useState('');
    var userInput = sUserInput[0], setUserInput = sUserInput[1];
    var sSelected = useState(null);
    var selected = sSelected[0], setSelected = sSelected[1];

    function close() {
        try { localStorage.setItem(storageKey, '1'); } catch(e) {}
        setOpen(false);
    }
    function next() {
        setUserInput('');
        setSelected(null);
        if (step + 1 < steps.length) setStep(step + 1);
        else close();
    }
    function prev() {
        if (step > 0) { setStep(step - 1); setUserInput(''); setSelected(null); }
    }

    if (!open || steps.length === 0) return null;

    var cur = steps[step];
    var isLast = step === steps.length - 1;

    var colMap = {
        orange:  { ring: '#f97316', btn: '#f97316', shadow: 'rgb(154,52,18)',  light: '#fff7ed', text: '#c2410c', bg: '#ffedd5' },
        purple:  { ring: '#a855f7', btn: '#a855f7', shadow: 'rgb(107,33,168)', light: '#faf5ff', text: '#7e22ce', bg: '#f3e8ff' },
        emerald: { ring: '#10b981', btn: '#10b981', shadow: 'rgb(4,120,87)',   light: '#f0fdf4', text: '#065f46', bg: '#d1fae5' }
    };
    var col = colMap[accentColor] || colMap.orange;

    var action = cur.action || 'none';
    var canProceed = false;
    if (action === 'none') canProceed = true;
    else if (action === 'tap' || action === 'select') canProceed = selected !== null;
    else if (action === 'type') canProceed = userInput.trim().length > 0;
    else if (action === 'notebook') canProceed = userInput === 'done';
    else if (action === 'trafficlight') canProceed = selected !== null;

    // ── 인터랙션 영역 렌더링 ──
    function renderInteraction() {
        // action이 none이어도 preview가 있으면 표시
        if (action === 'none') {
            if (cur.preview) return typeof cur.preview === 'function' ? cur.preview() : cur.preview;
            return null;
        }

        if (action === 'tap' || action === 'select') {
            var options = cur.options || [];
            return h("div", { style: { display:'flex', gap:'0.85rem', justifyContent:'center', flexWrap:'wrap' } },
                options.map(function(opt, i) {
                    var isSel = selected === (opt.value || opt.label);
                    var bgRaw = opt.bg || 'white';
                    return h(motion.button, {
                        key: i,
                        // 선택 전: 노란색 pulse 테두리 애니메이션
                        animate: isSel
                            ? { scale: 1.08, y: -4 }
                            : { scale: [1, 1.02, 1], boxShadow: ['0 0 0 0 rgba(234,179,8,0)', '0 0 0 6px rgba(234,179,8,0.5)', '0 0 0 0 rgba(234,179,8,0)'] },
                        transition: isSel
                            ? { type: 'spring', stiffness: 400, damping: 20 }
                            : { repeat: Infinity, duration: 1.5 },
                        onClick: (function(val) { return function() {
                            setSelected(val);
                            if (action === 'tap') setTimeout(function() { next(); }, 300);
                        }; })(opt.value || opt.label),
                        style: {
                            background: isSel ? col.btn : bgRaw,
                            color: isSel ? 'white' : (opt.color || '#374151'),
                            padding: '1rem 1.8rem',
                            borderRadius: '1.25rem',
                            fontWeight: 900,
                            fontSize: '1.5rem',
                            // 선택 전: 노란색 테두리, 선택 후: 액센트 테두리
                            border: isSel
                                ? ('4px solid ' + col.btn)
                                : '4px solid #EAB308',
                            cursor: 'pointer',
                            transition: 'all 0.2s',
                            boxShadow: isSel
                                ? ('0 8px 20px ' + col.btn + '55')
                                : '0 3px 12px rgba(234,179,8,0.35)',
                            display: 'flex', alignItems: 'center', gap: '0.55rem'
                        }
                    },
                        opt.emoji && h("span", { style: { fontSize: '1.8rem' } }, opt.emoji),
                        h("span", null, opt.label)
                    );
                })
            );
        }

        if (action === 'trafficlight') {
            var lights = [
                { g: 'red',    label: '속상하거나\n화나는 마음', color: '#EF4444', glow: 'rgba(239,68,68,0.7)'  },
                { g: 'yellow', label: '평범하거나\n궁금한 마음', color: '#F59E0B', glow: 'rgba(245,158,11,0.7)' },
                { g: 'green',  label: '기쁘고\n즐거운 마음',    color: '#10B981', glow: 'rgba(16,185,129,0.7)' }
            ];
            return h("div", { style: { background:'#1e293b', borderRadius:'2.5rem', padding:'1.2rem 2rem', display:'flex', gap:'2rem', justifyContent:'center', alignItems:'flex-end' } },
                lights.map(function(item) {
                    var isActive = selected === item.g;
                    return h("button", { key: item.g, onClick: (function(g){ return function(){ setSelected(g); setTimeout(function(){ next(); }, 500); }; })(item.g), style: { display:'flex', flexDirection:'column', alignItems:'center', gap:'0.6rem', background:'none', border:'none', cursor:'pointer' } },
                        h("div", { style: { width:'90px', height:'90px', borderRadius:'50%', background:'radial-gradient(circle at 35% 35%, '+item.color+'ff, '+item.color+'88)', boxShadow: isActive ? '0 0 35px '+item.glow+', inset -8px -8px 20px rgba(0,0,0,0.3)' : 'inset -8px -8px 20px rgba(0,0,0,0.4)', border: isActive ? '3px solid white' : '2px solid rgba(255,255,255,0.1)', transform: isActive ? 'scale(1.12)' : 'scale(1)', transition:'all 0.2s' } }),
                        h("p", { style: { color:item.color, fontWeight:900, fontSize:'1.1rem', textAlign:'center', whiteSpace:'pre-line', lineHeight:1.4 } }, item.label)
                    );
                })
            );
        }

        if (action === 'notebook') {
            var chars = (cur.chars || '오늘 아침에').split('');
            var wordColors = [col.btn, '#3b82f6', '#10b981', '#ef4444', '#a855f7'];
            var wordIdx = 0;
            var colored = [];
            var currentColor = wordColors[0];
            chars.forEach(function(ch) {
                if (ch === ' ') { wordIdx++; currentColor = wordColors[Math.min(wordIdx, wordColors.length-1)]; colored.push({ ch:' ', color:currentColor }); }
                else { colored.push({ ch:ch, color:currentColor }); }
            });
            var cells = [];
            for (var i = 0; i < 10; i++) cells.push(colored[i] || { ch:'', color:'#e2e8f0' });
            return h("div", { style: { display:'flex', flexDirection:'column', alignItems:'center', gap:'1.2rem', width:'100%' } },
                h("p", { style: { fontSize:'1.3rem', fontWeight:700, color:'#64748b' } }, "✏️ 아래 칸을 보면서 공책에 써봐요!"),
                h("div", { style: { display:'flex', gap:'6px', justifyContent:'center', flexWrap:'wrap' } },
                    cells.map(function(cell, i) {
                        if (cell.ch === ' ') return h("div", { key:i, style:{ width:'14px' } });
                        return h("div", { key:i, style:{ width:'62px', height:'70px', border:'3px solid '+(cell.ch?cell.color:'#d1d5db'), borderRadius:'10px', background:cell.ch?cell.color+'18':'#f8fafc', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'2rem', fontWeight:900, color:cell.ch?cell.color:'#d1d5db', position:'relative' } },
                            h("span", null, cell.ch || ''),
                            h("span", { style:{ position:'absolute', bottom:'3px', right:'5px', fontSize:'0.65rem', color:cell.ch?cell.color:'#d1d5db', fontWeight:700, opacity:0.7 } }, i+1)
                        );
                    })
                ),
                h("button", { onClick:function(){ setUserInput('done'); next(); }, style:{ background:col.btn, color:'white', padding:'0.85rem 2.5rem', borderRadius:'1rem', fontWeight:900, fontSize:'1.4rem', border:'4px solid #EAB308', cursor:'pointer', boxShadow:'0 5px 0 '+col.shadow } }, "✅ 공책에 다 썼어요!")
            );
        }

        if (action === 'type') {
            return h("div", { style:{ display:'flex', flexDirection:'column', gap:'0.85rem', width:'100%' } },
                h("input", { type:"text", value:userInput, onChange:function(e){ setUserInput(e.target.value); }, onKeyDown:function(e){ if(e.key==='Enter'&&userInput.trim()) next(); }, placeholder:cur.placeholder||'여기에 써보세요', autoFocus:true, style:{ width:'100%', padding:'1.1rem 1.3rem', fontSize:'1.6rem', fontWeight:900, borderRadius:'1rem', border:'3px solid '+col.ring, outline:'none', background:'white' } }),
                cur.examples && h("div", { style:{ display:'flex', gap:'0.6rem', flexWrap:'wrap', justifyContent:'center' } },
                    cur.examples.map(function(ex, i){ return h("button", { key:i, onClick:(function(t){ return function(){ setUserInput(t); }; })(ex), style:{ background:col.bg, color:col.text, padding:'0.55rem 1.1rem', borderRadius:'0.8rem', fontWeight:700, fontSize:'1.2rem', border:'none', cursor:'pointer' } }, '💡 '+ex); })
                )
            );
        }

        if (cur.preview) return typeof cur.preview === 'function' ? cur.preview() : cur.preview;
        return null;
    }

    var pos = cur.pos || 'center';

    return h("div", {
        style: {
            position: 'fixed', inset: 0, zIndex: 9999,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            background: 'rgba(0,0,0,0.55)',
            pointerEvents: 'auto'
        },
        onClick: function(e) { if (e.target === e.currentTarget) { /* 오버레이 클릭 무시 */ } }
    },
        h(motion.div, {
            key: step,
            initial: { opacity: 0, scale: 0.92, y: 20 },
            animate: { opacity: 1, scale: 1, y: 0 },
            transition: { type: 'spring', stiffness: 320, damping: 26 },
            style: {
                width: '92%',
                maxWidth: '820px',
                pointerEvents: 'auto'
            }
        },
            h("div", {
                style: {
                    background: 'white',
                    borderRadius: '1.75rem',
                    border: '4px solid ' + col.ring,
                    boxShadow: '0 20px 50px rgba(0,0,0,0.3)',
                    overflow: 'hidden'
                }
            },
                // 헤더
                h("div", {
                    style: {
                        background: col.btn,
                        padding: '1.2rem 1.8rem',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'space-between'
                    }
                },
                    h("div", { style: { display: 'flex', alignItems: 'center', gap: '0.7rem' } },
                        h("span", { style: { fontSize: '2.2rem' } }, cur.emoji),
                        h("span", { style: { color: 'white', fontWeight: 900, fontSize: '1.75rem' } }, cur.title)
                    ),
                    h("span", { style: { color: 'rgba(255,255,255,0.85)', fontWeight: 700, fontSize: '1.2rem' } },
                        (step + 1) + " / " + steps.length
                    )
                ),

                // 본문 — 설명 + 인터랙션
                h("div", { style: { padding: '1.75rem 2rem' } },
                    // 설명 텍스트
                    h("p", {
                        style: {
                            fontSize: '1.65rem',
                            fontWeight: 700,
                            color: '#374151',
                            lineHeight: 1.6,
                            wordBreak: 'keep-all',
                            overflowWrap: 'break-word',
                            whiteSpace: 'pre-line',
                            marginBottom: '1.3rem',
                            textAlign: 'center'
                        }
                    }, cur.desc),

                    // 인터랙션 영역
                    (action !== 'none' || cur.preview) && h("div", {
                        style: {
                            background: col.light,
                            border: action !== 'none' ? ('3px dashed #EAB308') : ('2px dashed ' + col.ring),
                            borderRadius: '1rem',
                            padding: '1.4rem',
                            minHeight: '110px',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center'
                        }
                    }, renderInteraction()),

                    // 액션 안내 — 노란색 강조
                    action !== 'none' && h("div", {
                        style: {
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            gap: '0.5rem',
                            marginTop: '1rem'
                        }
                    },
                        h(motion.span, {
                            animate: { rotate: [0, -15, 15, -15, 0] },
                            transition: { repeat: Infinity, duration: 1.5, repeatDelay: 0.5 },
                            style: { fontSize: '1.4rem', display: 'inline-block' }
                        }, '👆'),
                        h("p", {
                            style: {
                                fontSize: '1.2rem',
                                fontWeight: 900,
                                color: '#92400e',
                                background: '#fef9c3',
                                border: '2px solid #EAB308',
                                borderRadius: '0.75rem',
                                padding: '0.3rem 0.9rem'
                            }
                        },
                            action === 'tap'          ? '노란 테두리 버튼을 눌러봐요!' :
                            action === 'select'        ? '하나를 골라봐요!' :
                            action === 'type'          ? '직접 입력하거나 예시를 눌러봐요!' :
                            action === 'notebook'      ? '공책에 다 썼으면 버튼을 눌러요!' :
                            action === 'trafficlight'  ? '신호등을 눌러봐요!' : ''
                        )
                    )
                ),

                // 하단 버튼 + 도트
                h("div", { style: { padding: '0 2rem 1.75rem', display: 'flex', flexDirection: 'column', gap: '1rem' } },
                    h("div", { style: { display: 'flex', justifyContent: 'center', gap: '0.5rem' } },
                        steps.map(function(_, i) {
                            return h("div", {
                                key: i,
                                style: {
                                    borderRadius: '999px',
                                    height: '14px',
                                    width: i === step ? '38px' : '14px',
                                    background: i === step ? col.btn : '#e2e8f0',
                                    transition: 'all 0.3s'
                                }
                            });
                        })
                    ),
                    h("div", { style: { display: 'flex', gap: '0.85rem' } },
                        step > 0 && h("button", {
                            onClick: prev,
                            style: {
                                flex: 1, padding: '1.2rem', borderRadius: '1.1rem',
                                fontWeight: 900, fontSize: '1.5rem',
                                border: '2px solid #e2e8f0', background: 'white', color: '#64748b',
                                cursor: 'pointer'
                            }
                        }, "← 이전"),
                        action !== 'tap' && action !== 'notebook' && action !== 'trafficlight' && h("button", {
                            onClick: next,
                            disabled: !canProceed,
                            style: {
                                flex: 1, padding: '1.2rem', borderRadius: '1.1rem',
                                fontWeight: 900, fontSize: '1.5rem',
                                background: canProceed ? col.btn : '#cbd5e1',
                                color: 'white', border: 'none',
                                cursor: canProceed ? 'pointer' : 'not-allowed',
                                boxShadow: canProceed ? ('0 5px 0 ' + col.shadow) : 'none'
                            }
                        }, isLast ? "시작하기! 🎉" : "다음 →")
                    )
                )
            )
        )
    );
}


function StageHeader(props) {
    var currentKey = props.currentKey;         // 's1_1' 등
    var onChangeStage = props.onChangeStage;   // 단계 전환 콜백
    var onGoHome = props.onGoHome;             // 홈 버튼 콜백
    var rightSlot = props.rightSlot;           // 우측 추가 영역 (카드 카운터 등)

    var current = null;
    for (var i = 0; i < STAGE_OPTIONS.length; i++) {
        if (STAGE_OPTIONS[i].key === currentKey) { current = STAGE_OPTIONS[i]; break; }
    }
    if (!current) current = STAGE_OPTIONS[0];

    // subStep에 맞는 동적 라벨 계산
    var subStep = props.subStep || '';
    var displayLabel = (current.subLabels && subStep && current.subLabels[subStep])
        ? current.subLabels[subStep]
        : current.label;

    function handleChange(e) {
        var key = e.target.value;
        if (key && key !== currentKey && onChangeStage) {
            onChangeStage(key);
        }
    }

    // 현재 단계 번호 (1/2/3)
    var stageNum = currentKey === 's1_1' || currentKey === 's1_2' ? '1'
                 : currentKey === 's2_1' || currentKey === 's2_2' ? '2'
                 : '3';
    var STAGE_BG = { '1':'bg-amber-100 text-amber-700 border-amber-300', '2':'bg-blue-100 text-blue-700 border-blue-300', '3':'bg-emerald-100 text-emerald-700 border-emerald-300' };
    var stageBgCls = STAGE_BG[stageNum] || STAGE_BG['1'];

    // 드롭다운 열기/닫기 state
    var sDropOpen = useState(false);
    var dropOpen = sDropOpen[0], setDropOpen = sDropOpen[1];

    // 단계→화면키 매핑
    function stageToKey(n) {
        if (n === '1') return 's1_1';
        if (n === '2') return 's1_2';
        if (n === '3') return 's3';
        return 's1_1';
    }

    var STAGE_LABELS = [
        { num: '1', label: '1단계  낱말 카드 모으기', cls: 'bg-amber-100 text-amber-700 border-amber-300' },
        { num: '2', label: '2단계  문장 만들기',       cls: 'bg-blue-100 text-blue-700 border-blue-300'   },
        { num: '3', label: '3단계  일기쓰기',          cls: 'bg-emerald-100 text-emerald-700 border-emerald-300' }
    ];
    var currentStageLabel = STAGE_LABELS.filter(function(s){ return s.num === stageNum; })[0] || STAGE_LABELS[0];

    return h("div", { className: "px-4 pt-3 pb-2 flex items-center gap-3 shrink-0" },
        // 좌측: 단계 선택 (커스텀 드롭다운)
        h("div", { className: "relative" },
            h("button", {
                onClick: function(){ setDropOpen(!dropOpen); },
                className: "px-4 py-2 rounded-xl font-black text-base border-2 cursor-pointer flex items-center gap-2 " + currentStageLabel.cls
            },
                h("span", null, currentStageLabel.label),
                h("span", { style: { fontSize: '0.75rem' } }, dropOpen ? "▲" : "▼")
            ),
            dropOpen && h("div", {
                style: { position: 'absolute', top: '110%', left: 0, zIndex: 100, background: 'white', borderRadius: '0.75rem', border: '2px solid #e2e8f0', boxShadow: '0 8px 24px rgba(0,0,0,0.12)', overflow: 'hidden', minWidth: '220px' }
            },
                STAGE_LABELS.map(function(s) {
                    return h("button", {
                        key: s.num,
                        onClick: function() {
                            setDropOpen(false);
                            if (s.num !== stageNum && onChangeStage) onChangeStage(stageToKey(s.num));
                        },
                        className: "w-full text-left px-4 py-3 font-black text-base hover:bg-slate-50 border-b border-slate-100 last:border-0 " +
                            (s.num === stageNum ? s.cls : 'text-slate-600')
                    }, s.label);
                })
            )
        ),

        // 홈 버튼
        h("button", {
            onClick: onGoHome,
            className: "px-3 py-2 bg-white text-slate-700 rounded-xl font-black text-sm border-2 border-slate-200 hover:border-slate-400 hover:bg-slate-50 flex items-center gap-1.5 shadow-sm"
        },
            h("span", { className: "text-xl" }, "🏠"),
            h("span", null, "홈")
        ),

        // 우측 슬롯 (카드 카운터 등)
        rightSlot && h("div", { className: "ml-auto" }, rightSlot)
    );
}

// ═══════════════════════════════════════════════
// 공용 컴포넌트 — 폭죽 (정답 시 표시)
// ═══════════════════════════════════════════════
function Confetti(props) {
    var show = props.show;
    if (!show) return null;

    // 폭죽 조각 30개 — 색·크기·각도 랜덤
    var colors = ['#F87171', '#FB923C', '#FBBF24', '#FACC15', '#34D399', '#22D3EE', '#60A5FA', '#A78BFA', '#F472B6'];
    var pieces = [];
    for (var i = 0; i < 30; i++) {
        var angle = (Math.PI * 2 * i) / 30 + (Math.random() - 0.5) * 0.4;
        var distance = 280 + Math.random() * 200;
        pieces.push({
            id: i,
            color: colors[i % colors.length],
            dx: Math.cos(angle) * distance,
            dy: Math.sin(angle) * distance - 100, // 살짝 위로
            rot: Math.random() * 720,
            size: 10 + Math.random() * 8,
            delay: Math.random() * 0.15
        });
    }

    return h("div", {
        className: "fixed inset-0 pointer-events-none flex items-center justify-center",
        style: { zIndex: 9999 }
    },
        // 중앙 큰 이모지
        h(motion.div, {
            initial: { scale: 0, rotate: -180 },
            animate: { scale: [0, 1.3, 1], rotate: 0 },
            transition: { duration: 0.6, times: [0, 0.5, 1] },
            className: "text-9xl",
            style: { filter: 'drop-shadow(0 0 30px rgba(251, 191, 36, 0.6))' }
        }, "🎉"),

// 감정 단어(사전형) → 과거형 명시 매핑 (정확도 우선)

    '속상하다':'속상했다', '서운하다':'서운했다', '화나다':'화났다', '무섭다':'무서웠다',
    '슬프다':'슬펐다', '힘들다':'힘들었다', '외롭다':'외로웠다', '걱정된다':'걱정됐다',
    '걱정되다':'걱정됐다', '부끄럽다':'부끄러웠다', '떨리다':'떨렸다',
    '궁금하다':'궁금했다', '쑥스럽다':'쑥스러웠다', '부럽다':'부러웠다', '심심하다':'심심했다',
    '피곤하다':'피곤했다', '긴장된다':'긴장됐다', '긴장되다':'긴장됐다', '어색하다':'어색했다', '멍하다':'멍했다',
    '뿌듯하다':'뿌듯했다', '설레다':'설렜다', '신나다':'신났다', '기쁘다':'기뻤다',
    '재미있다':'재미있었다', '고맙다':'고마웠다', '행복하다':'행복했다', '편안하다':'편안했다',
    '즐겁다':'즐거웠다', '사랑스럽다':'사랑스러웠다',
    '아프다':'아팠다', '아쉽다':'아쉬웠다', '지루하다':'지루했다'
};

// 감정 단어를 과거형으로 변환 (매핑 우선, 없으면 규칙 폴백)
function toPastFeeling(word) {
    if (!word) return word;
    var w = String(word).trim();
    if (/(았다|었다|였다|했다|됐다|렜다|뻤다|펐다)$/.test(w)) return w;  // 이미 과거형
    if (FEELING_PAST_MAP[w]) return FEELING_PAST_MAP[w];               // 매핑 우선
    if (/하다$/.test(w)) return w.replace(/하다$/, '했다');
    if (/되다$/.test(w)) return w.replace(/되다$/, '됐다');
    if (/나다$/.test(w)) return w.replace(/나다$/, '났다');
    if (/다$/.test(w)) return w.slice(0, -1) + '었다';
    return w;
}

function ColoredSentence(props) {
    var parts = props.parts;
    var size = props.size || 'lg'; // 'sm' or 'lg'
    var keys = ['when', 'where', 'who', 'what', 'feeling'];
    var textSize = size === 'sm' ? 'text-xl md:text-2xl' : 'text-2xl md:text-3xl';
    var pad = size === 'sm' ? 'px-4 py-2.5' : 'px-4 py-3';
    // 배열이 아니거나 비어있으면 빈 표시
    if (!parts || !Array.isArray(parts) || parts.length === 0) {
        return h("span", { className: "text-slate-400 font-bold" }, "예시 없음");
    }
    return h("div", { className: "flex flex-wrap items-end gap-2 justify-center" },
        parts.map(function (p, i) {
            var c = FIELD_COLORS[keys[i]] || FIELD_COLORS['when'];
            return h("div", { key: i, className: "flex flex-col items-center gap-0.5" },
                h("span", { className: "text-xs font-black " + c.text }, c.name),
                h("span", {
                    className: pad + " rounded-xl font-black shadow-sm border-2 " + textSize + " " + c.bg + " " + c.text + " " + c.border
                }, p || '')
            );
        })
    );
}

// 한 문장을 4영역으로 받아서, 글자별로 색을 매칭해 10칸 공책에 그리기
function buildCellGrid(parts) {
    // parts = [언제, 어디서, 누구와, 무엇을, (감정)]
    var keys = ['when', 'where', 'who', 'what', 'feeling'];
    // 빈 요소 제거하면서 색상 키도 함께 정리
    var realParts = [];
    for (var pi = 0; pi < parts.length; pi++) {
        var w = parts[pi];
        if (w && String(w).trim() !== '') {
            realParts.push({ word: String(w).trim(), color: keys[pi] });
        }
    }
    var cells = [];
    var lastColor = null;
    for (var i = 0; i < realParts.length; i++) {
        var word = realParts[i].word;
        var col = realParts[i].color;
        lastColor = col;
        for (var j = 0; j < word.length; j++) {
            var ch = word.charAt(j);
            if (ch === ' ') {
                cells.push({ ch: '', color: null, isSpace: true });
            } else {
                cells.push({ ch: ch, color: col });
            }
        }
        // 어절 사이 공백 (마지막 어절 뒤에는 없음)
        if (i < realParts.length - 1) {
            cells.push({ ch: '', color: null, isSpace: true });
        }
    }
    // 문장 끝 마침표 — 항상 추가 (마지막 어절 색상)
    cells.push({ ch: '.', color: lastColor || 'what', isPeriod: true });
    return cells;
}

// 공책 칸 그리기 (cells = 글자 배열, 칸당 10개씩 줄바꿈)
// 줄 수에 따라 칸 크기를 자동 조절: 1~2줄=큼, 3줄=중간, 4줄+=작음
function NotebookGrid(props) {
    var cells = props.cells;
    var perRow = 10;
    // 첫 줄 들여쓰기: 첫 칸 빈 칸 추가
    var paddedCells = [{ ch: '', color: null, isEmpty: true }].concat(cells);
    // 줄바꿈 자리에 공백 칸(isSpace)이 오면 제거 → 다음 줄 첫 칸부터 시작
    var packed = [];
    var col = 0;
    for (var pi = 0; pi < paddedCells.length; pi++) {
        var cellP = paddedCells[pi];
        // 줄 시작(col===0)이고 공백 칸이면 건너뛰기
        if (col === 0 && cellP.isSpace) continue;
        packed.push(cellP);
        col++;
        if (col >= perRow) col = 0;
    }
    var rows = [];
    for (var i = 0; i < packed.length; i += perRow) {
        rows.push(packed.slice(i, i + perRow));
    }
    // 마지막 줄이 10칸 미만이면 빈 칸으로 채워서 시각적 정렬
    while (rows[rows.length - 1].length < perRow) {
        rows[rows.length - 1].push({ ch: '', color: null, isEmpty: true });
    }

    // 줄 수에 따라 셀 크기 결정 (가독성과 화면 맞춤의 균형)
    var lineCount = rows.length;
    var cellSize, textSize, gap;
    if (lineCount <= 2) {
        cellSize = 'w-20 h-20'; textSize = 'text-4xl'; gap = 'gap-3';
    } else if (lineCount === 3) {
        cellSize = 'w-16 h-16'; textSize = 'text-3xl'; gap = 'gap-2';
    } else {
        // 4줄 이상
        cellSize = 'w-14 h-14'; textSize = 'text-2xl'; gap = 'gap-2';
    }

    return h("div", { className: "flex flex-col " + gap },
        rows.map(function (row, ri) {
            return h("div", { key: ri, className: "flex " + gap },
                row.map(function (cell, ci) {
                    var bgClass = 'bg-white';
                    var textClass = 'text-slate-700';
                    var borderClass = 'border-slate-300';
                    if (cell.color) {
                        var c = FIELD_COLORS[cell.color];
                        bgClass = c.bg;
                        textClass = c.text;
                        borderClass = c.border;
                    }
                    if (cell.isSpace) {
                        // 빈 칸(띄어쓰기): 옅은 회색
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-200 border-dashed';
                    }
                    if (cell.isEmpty) {
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-100';
                    }
                    // 마침표: 왼쪽 아래, 마지막 어절 색상 배경 + 큰 글씨
                    if (cell.isPeriod) {
                        var PERIOD_MAP = {
                            'when':    { bg: '#fef3c7', border: '#f59e0b', text: '#92400e' },
                            'where':   { bg: '#dbeafe', border: '#3b82f6', text: '#1e40af' },
                            'who':     { bg: '#d1fae5', border: '#10b981', text: '#065f46' },
                            'what':    { bg: '#fee2e2', border: '#ef4444', text: '#991b1b' },
                            'feeling': { bg: '#ede9fe', border: '#a855f7', text: '#5b21b6' }
                        };
                        var pm = (cell.color && PERIOD_MAP[cell.color]) ? PERIOD_MAP[cell.color] : { bg: '#fee2e2', border: '#ef4444', text: '#991b1b' };
                        return h("div", {
                            key: ci,
                            className: cellSize + " border-4 rounded-xl shadow-sm",
                            style: {
                                display: 'flex',
                                alignItems: 'flex-end',
                                justifyContent: 'flex-start',
                                background: pm.bg,
                                borderColor: pm.border
                            }
                        },
                            h("span", {
                                style: { fontSize: '4rem', fontWeight: 900, color: pm.text, lineHeight: 0.85, paddingLeft: '0.25rem', paddingBottom: '0.05rem' }
                            }, ".")
                        );
                    }
                    return h("div", {
                        key: ci,
                        className: cellSize + " border-4 rounded-xl flex items-center justify-center font-black shadow-sm " + textSize + " " + bgClass + " " + textClass + " " + borderClass
                    }, cell.ch);
                })
            );
        })
    );
}

// ───── 음성 비교 헬퍼 ─────
// 비교용 정규화: 공백 제거, 조사 일부 제거 (1-2학년 발음 차이 흡수)
function normalize(s) {
    if (!s) return '';
    var t = String(s).toLowerCase();
    // 모든 공백/특수문자 제거
    t = t.replace(/[\s.,!?~'"`\-_]+/g, '');
    return t;
}

// 한 요소(예: '학교에서')가 음성에 포함되는지 검사
// 어절 핵심부 추출 후 매칭 (조사 변동 흡수)
function fieldMatched(transcript, target) {
    var nT = normalize(transcript);
    var nTarget = normalize(target);
    if (!nT || !nTarget) return false;

    // 1) 직접 포함되면 OK
    if (nT.indexOf(nTarget) !== -1) return true;

    // 2) 어간 추출 비교: 대상에서 흔한 어미/조사 제거 후 비교
    //    "학교에서" → "학교", "친구랑" → "친구", "반갑게 인사했다" → "반갑게인사"
    var trimmed = nTarget
        .replace(/(에서|에게|이랑|랑|이|가|을|를|은|는|와|과|께|에)$/g, '')
        .replace(/(했다|했어요|했어|했지|한다)$/g, '하')
        .replace(/(었다|었어요|었어|었지)$/g, '');
    if (trimmed.length >= 2 && nT.indexOf(trimmed) !== -1) return true;

    // 3) 글자 단위 부분 일치: 대상의 70% 이상 문자가 순서대로 나타나면 OK
    //    (음성 인식 오류 흡수용)
    if (nTarget.length >= 2) {
        var matched = 0, idx = 0;
        for (var i = 0; i < nTarget.length; i++) {
            var pos = nT.indexOf(nTarget.charAt(i), idx);
            if (pos !== -1) { matched++; idx = pos + 1; }
        }
        if (matched / nTarget.length >= 0.7) return true;
    }
    return false;
}

// 예시문장 4요소가 각각 음성에 들어갔는지 검사
// ═══════════════════════════════════════════════
// 한국어 TTS (자연스러운 Google/Neural 음성 우선)
// ═══════════════════════════════════════════════
var _ttsCache = { voice: null, ready: false };

function _selectKoreanVoice() {
    if (!window.speechSynthesis) return null;
    var voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return null;

    // 1순위: Google 한국어 (클라우드 음성, 가장 자연스러움)
    var v1 = voices.find(function(v) {
        return v.lang === 'ko-KR' &&
               v.name.toLowerCase().indexOf('google') !== -1 &&
               !v.localService;
    });
    if (v1) return v1;

    // 2순위: Wavenet/Neural2 (Google Cloud)
    var v2 = voices.find(function(v) {
        return v.lang === 'ko-KR' &&
               (v.name.indexOf('Wavenet') !== -1 || v.name.indexOf('Neural') !== -1);
    });
    if (v2) return v2;

    // 3순위: 자연스러움 키워드
    var v3 = voices.find(function(v) {
        return v.lang === 'ko-KR' &&
               /wavenet|neural|premium|enhanced|natural/i.test(v.name);
    });
    if (v3) return v3;

    // 4순위: 그냥 ko-KR
    var v4 = voices.find(function(v) { return v.lang === 'ko-KR'; });
    if (v4) return v4;

    // 5순위: 한국어 비슷한 것
    return voices.find(function(v) { return v.lang && v.lang.indexOf('ko') === 0; }) || null;
}

// 음성 목록 로드 (브라우저마다 비동기로 로드됨)
if (window.speechSynthesis) {
    var loadVoices = function() {
        _ttsCache.voice = _selectKoreanVoice();
        _ttsCache.ready = true;
    };
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
}

// 음성 재생
function speakKorean(text, opts) {
    if (!text || !window.speechSynthesis) return;
    opts = opts || {};
    // 진행 중인 발화 중지
    window.speechSynthesis.cancel();

    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.pitch = opts.pitch != null ? opts.pitch : 1.0;  // 기본 1.0
    utter.rate = opts.rate != null ? opts.rate : 0.95;    // 약간 천천히, 자연스럽게
    utter.volume = opts.volume != null ? opts.volume : 1.0;

    var voice = _ttsCache.voice || _selectKoreanVoice();
    if (voice) utter.voice = voice;

    if (opts.onstart) utter.onstart = opts.onstart;
    if (opts.onend) utter.onend = opts.onend;

    window.speechSynthesis.speak(utter);
    return utter;
}

// 듣기 버튼 컴포넌트
function ListenButton(props) {
    var text = props.text || '';
    var label = props.label || '🔊 들어보기';
    var color = props.color || 'blue';
    var s = useState(false);
    var speaking = s[0], setSpeaking = s[1];

    function handleClick(e) {
        e.stopPropagation();
        if (speaking) {
            window.speechSynthesis.cancel();
            setSpeaking(false);
            return;
        }
        setSpeaking(true);
        speakKorean(text, {
            onend: function() { setSpeaking(false); }
        });
    }

    var colorClass = {
        blue:   'bg-blue-500 hover:bg-blue-600 shadow-[0_4px_0_rgb(29,78,216)]',
        purple: 'bg-purple-500 hover:bg-purple-600 shadow-[0_4px_0_rgb(107,33,168)]',

    }[color] || 'bg-blue-500 shadow-[0_4px_0_rgb(29,78,216)]';

    return h("button", {
        onClick: handleClick,
        className: "px-7 py-4 rounded-2xl text-white text-xl font-black active:translate-y-1 active:shadow-none " + colorClass
    }, speaking ? "⏸️ 그만 듣기" : label);

function checkAllFields(transcript, exampleParts) {
    // exampleParts = [언제, 어디서, 누구와, 무엇을]
    var keys = ['when', 'where', 'who', 'what', 'feeling'];
    var result = {};
    for (var i = 0; i < 4; i++) {
        result[keys[i]] = fieldMatched(transcript, exampleParts[i]);
    }
    return result;
}

function Stage1_1(props) {

        // 유효성 검증: 4요소 문자열 배열인지
        function isValid(rows) {
            if (!rows || !Array.isArray(rows) || rows.length === 0) return false;
            return rows.every(function(row) {
                return Array.isArray(row) && row.length >= 4 &&
                       row[0] && row[1] && row[2] && row[3];
            });
        }

        if (isValid(found)) return found;

        // 자동 생성: 선택한 카테고리 단어를 포함한 예시 3개

            ['학교 끝나고', '운동장에서', '친구들과', '신나게 놀았다'],

// 한 문장을 5영역으로 받아서, 글자별로 색을 매칭해 10칸 공책에 그리기
function buildCellGrid(parts) {
    var keys = FIELD_KEYS;
    // parts는 객체 {when,...} 또는 배열 — 양쪽 지원, 빈 요소 제거
    var realParts = [];
    for (var pi = 0; pi < keys.length; pi++) {
        var w = Array.isArray(parts) ? parts[pi] : parts[keys[pi]];
        if (w && String(w).trim() !== '') {
            realParts.push({ word: String(w).trim(), color: keys[pi] });
        }
    }
    var cells = [];
    var lastColor = null;
    for (var i = 0; i < realParts.length; i++) {
        var word = realParts[i].word;
        var col2 = realParts[i].color;
        lastColor = col2;
        for (var j = 0; j < word.length; j++) {
            var ch = word.charAt(j);
            if (ch === ' ') {
                cells.push({ ch: '', color: null, isSpace: true });
            } else {
                cells.push({ ch: ch, color: col2 });
            }
        }
        if (i < realParts.length - 1) {
            cells.push({ ch: '', color: null, isSpace: true });
        }
    }
    // 문장 끝 마침표 — 항상 추가
    cells.push({ ch: '.', color: lastColor || 'what', isPeriod: true });
    return cells;
}

// 공책 칸 그리기 (cells = 글자 배열, 칸당 10개씩 줄바꿈)
function NotebookGrid(props) {
    var cells = props.cells;
    var perRow = 10;
    // 첫 줄 들여쓰기: 첫 칸 빈 칸 추가
    var paddedCells = [{ ch: '', color: null, isEmpty: true }].concat(cells);
    // 줄바꿈 자리에 공백 칸(isSpace)이 오면 제거 → 다음 줄 첫 칸부터 시작
    var packed = [];
    var col = 0;
    for (var pi = 0; pi < paddedCells.length; pi++) {
        var cellP = paddedCells[pi];
        if (col === 0 && cellP.isSpace) continue;
        packed.push(cellP);
        col++;
        if (col >= perRow) col = 0;
    }
    var rows = [];
    for (var i = 0; i < packed.length; i += perRow) {
        rows.push(packed.slice(i, i + perRow));
    }
    while (rows[rows.length - 1].length < perRow) {
        rows[rows.length - 1].push({ ch: '', color: null, isEmpty: true });
    }

    var lineCount = rows.length;
    var cellSize, textSize, gap;
    if (lineCount <= 2) {
        cellSize = 'w-20 h-20'; textSize = 'text-4xl'; gap = 'gap-3';
    } else if (lineCount === 3) {
        cellSize = 'w-16 h-16'; textSize = 'text-3xl'; gap = 'gap-2';
    } else {
        cellSize = 'w-14 h-14'; textSize = 'text-2xl'; gap = 'gap-2';
    }

    return h("div", { className: "flex flex-col " + gap },
        rows.map(function (row, ri) {
            return h("div", { key: ri, className: "flex " + gap },
                row.map(function (cell, ci) {
                    var bgClass = 'bg-white';
                    var textClass = 'text-slate-700';
                    var borderClass = 'border-slate-300';
                    if (cell.color) {
                        var c = FIELD_COLORS[cell.color];
                        bgClass = c.bg;
                        textClass = c.text;
                        borderClass = c.border;
                    }
                    if (cell.isSpace) {
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-200 border-dashed';
                    }
                    if (cell.isEmpty) {
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-100';
                    }
                    // 마침표: 왼쪽 아래, 마지막 어절 색상 배경 + 큰 글씨
                    if (cell.isPeriod) {
                        var PERIOD_MAP = {
                            'when':    { bg: '#fef3c7', border: '#f59e0b', text: '#92400e' },
                            'where':   { bg: '#dbeafe', border: '#3b82f6', text: '#1e40af' },
                            'who':     { bg: '#d1fae5', border: '#10b981', text: '#065f46' },
                            'what':    { bg: '#fee2e2', border: '#ef4444', text: '#991b1b' },
                            'feeling': { bg: '#ede9fe', border: '#a855f7', text: '#5b21b6' }

                        return h("div", {
                            key: ci,
                            className: cellSize + " border-4 rounded-xl shadow-sm",
                            style: {
                                display: 'flex',
                                alignItems: 'flex-end',
                                justifyContent: 'flex-start',
                                background: pm.bg,
                                borderColor: pm.border
                            }
                        },
                            h("span", {
                                style: { fontSize: '4rem', fontWeight: 900, color: pm.text, lineHeight: 0.85, paddingLeft: '0.25rem', paddingBottom: '0.05rem' }
                            }, ".")
                        );
                    }
                    return h("div", {
                        key: ci,
                        className: cellSize + " border-4 rounded-xl flex items-center justify-center font-black shadow-sm " + textSize + " " + bgClass + " " + textClass + " " + borderClass
                    }, cell.ch);
                })
            );
        })
    );
}

// "무엇을" 문구(+선택적으로 문장 전체)에서 추천 감정 찾기
function findRecommendedFeelings(whatText, fullSentence) {
    var results = [];
    if (!whatText && !fullSentence) return results;

    // 키워드를 공백 제거 후 길이 내림차순 정렬 (구체적 매칭 우선)
    var keyList = Object.keys(RECOMMENDED_FEELINGS).map(function(k) {
        return { orig: k, clean: k.replace(/\s+/g, '') };
    }).sort(function(a, b) {
        return b.clean.length - a.clean.length;
    });

    // 1) 무엇을(what) 텍스트에서 — 가장 구체적인(긴) 키 하나만 사용
    var whatClean = whatText ? String(whatText).replace(/\s+/g, '') : '';
    if (whatClean) {
        for (var i = 0; i < keyList.length; i++) {
            if (whatClean.indexOf(keyList[i].clean) !== -1) {
                RECOMMENDED_FEELINGS[keyList[i].orig].forEach(function(f) {
                    if (results.indexOf(f) === -1) results.push(f);
                });
                break;
            }
        }
    }

    // 2) 무엇을에서 매칭 실패 시에만 문장 전체 검색 (폴백)
    if (results.length === 0 && fullSentence) {
        var sentClean = String(fullSentence).replace(/\s+/g, '');
        for (var j = 0; j < keyList.length; j++) {
            if (keyList[j].clean.length >= 2 && sentClean.indexOf(keyList[j].clean) !== -1) {
                RECOMMENDED_FEELINGS[keyList[j].orig].forEach(function(f) {
                    if (results.indexOf(f) === -1) results.push(f);
                });
                break;
            }
        }
    }

    return results;
}



// ────── 음성 비교 헬퍼 (1단계와 동일) ──────
function normalize(s) {
    if (!s) return '';
    var t = String(s).toLowerCase();
    t = t.replace(/[\s.,!?~'"`\-_]+/g, '');
    return t;
}
function fieldMatched(transcript, target) {
    var nT = normalize(transcript);
    var nTarget = normalize(target);
    if (!nT || !nTarget) return false;
    if (nT.indexOf(nTarget) !== -1) return true;
    var trimmed = nTarget
        .replace(/(에서|에게|이랑|랑|이|가|을|를|은|는|와|과|께|에)$/g, '')
        .replace(/(했다|했어요|했어|했지|한다)$/g, '하')
        .replace(/(었다|었어요|었어|었지)$/g, '');
    if (trimmed.length >= 2 && nT.indexOf(trimmed) !== -1) return true;
    if (nTarget.length >= 2) {
        var matched = 0, idx = 0;
        for (var i = 0; i < nTarget.length; i++) {
            var pos = nT.indexOf(nTarget.charAt(i), idx);
            if (pos !== -1) { matched++; idx = pos + 1; }
        }
        if (matched / nTarget.length >= 0.7) return true;
    }
    return false;
}
function checkAllFields(transcript, parts) {
    var keys = FIELD_KEYS;
    var result = {};
    for (var i = 0; i < keys.length; i++) {
        result[keys[i]] = fieldMatched(transcript, parts[i]);
    }
    return result;
}

// 공책 칸 셀
function buildCellGrid(parts) {
    var keys = FIELD_KEYS;
    var realParts = [];
    for (var pi = 0; pi < keys.length; pi++) {
        var w = Array.isArray(parts) ? parts[pi] : parts[keys[pi]];
        if (w && String(w).trim() !== '') {
            realParts.push({ word: String(w).trim(), color: keys[pi] });
        }
    }
    var cells = [];
    var lastColor = null;
    for (var i = 0; i < realParts.length; i++) {
        var word = realParts[i].word;
        var col3 = realParts[i].color;
        lastColor = col3;
        for (var j = 0; j < word.length; j++) {
            var ch = word.charAt(j);
            if (ch === ' ') cells.push({ ch: '', color: null, isSpace: true });
            else cells.push({ ch: ch, color: col3 });
        }
        if (i < realParts.length - 1) cells.push({ ch: '', color: null, isSpace: true });
    }
    cells.push({ ch: '.', color: lastColor || 'what', isPeriod: true });
    return cells;
}

// 공책 그리기 (1단계와 동일)
function NotebookGrid(props) {
    var cells = props.cells;
    var perRow = 10;

    // ── 첫 줄 앞에 빈 칸 하나 삽입 ──
    var paddedCells = [{ ch:'', color:null, isEmpty:true }].concat(cells);

    // 줄바꿈 자리에 공백 칸(isSpace)이 오면 제거 → 다음 줄 첫 칸부터 시작
    var packed = [];
    var col = 0;
    for (var pi = 0; pi < paddedCells.length; pi++) {
        var cellP = paddedCells[pi];
        if (col === 0 && cellP.isSpace) continue;
        packed.push(cellP);
        col++;
        if (col >= perRow) col = 0;
    }

    var rows = [];
    for (var i = 0; i < packed.length; i += perRow) rows.push(packed.slice(i, i + perRow));
    // 마지막 줄 빈 칸 채우기
    while (rows[rows.length - 1].length < perRow) rows[rows.length - 1].push({ ch:'', color:null, isEmpty:true });

    var lineCount = rows.length;
    var cellSize, textSize, gap;
    if (lineCount <= 2) { cellSize = 'w-24 h-24'; textSize = 'text-5xl'; gap = 'gap-4'; }
    else if (lineCount === 3) { cellSize = 'w-20 h-20'; textSize = 'text-4xl'; gap = 'gap-3'; }
    else { cellSize = 'w-16 h-16'; textSize = 'text-3xl'; gap = 'gap-2'; }
    return h("div", { className: "flex flex-col " + gap },
        rows.map(function (row, ri) {
            return h("div", { key: ri, className: "flex " + gap },
                row.map(function (cell, ci) {
                    var bgClass = 'bg-white', textClass = 'text-slate-700', borderClass = 'border-slate-300';
                    if (cell.color) { var c = FIELD_COLORS[cell.color]; bgClass = c.bg; textClass = c.text; borderClass = c.border; }
                    if (cell.isSpace) { bgClass = 'bg-slate-50'; borderClass = 'border-slate-200 border-dashed'; }
                    if (cell.isEmpty) { bgClass = 'bg-slate-50'; borderClass = 'border-slate-100'; }
                    if (cell.isPeriod) {
                        var PERIOD_MAP3 = {
                            'when':    { bg: '#fef3c7', border: '#f59e0b', text: '#92400e' },
                            'where':   { bg: '#dbeafe', border: '#3b82f6', text: '#1e40af' },
                            'who':     { bg: '#d1fae5', border: '#10b981', text: '#065f46' },
                            'what':    { bg: '#fee2e2', border: '#ef4444', text: '#991b1b' },
                            'feeling': { bg: '#ede9fe', border: '#a855f7', text: '#5b21b6' }
                        };
                        var pm3 = (cell.color && PERIOD_MAP3[cell.color]) ? PERIOD_MAP3[cell.color] : { bg: '#fee2e2', border: '#ef4444', text: '#991b1b' };
                        return h("div", {
                            key: ci,
                            className: cellSize + " border-4 rounded-xl shadow-sm",
                            style: {
                                display: 'flex',
                                alignItems: 'flex-end',
                                justifyContent: 'flex-start',
                                background: pm3.bg,
                                borderColor: pm3.border
                            }
                        },
                            h("span", {
                                style: { fontSize: '4rem', fontWeight: 900, color: pm3.text, lineHeight: 0.85, paddingLeft: '0.25rem', paddingBottom: '0.05rem' }
                            }, ".")
                        );
                    }
                    return h("div", {
                        key: ci,
                        className: cellSize + " border-4 rounded-xl flex items-center justify-center font-black shadow-sm " + textSize + " " + bgClass + " " + textClass + " " + borderClass
                    }, cell.ch);
                })
            );
        })
    );
}

        when:  '학교 끝나고',

// 감정들을 자연스럽게 연결 ("기쁘다, 신나다" → "기쁘고 신났다" 또는 "기쁘면서 신났다")
function joinFeelings(feelings) {
    if (!feelings || feelings.length === 0) return '';
    if (feelings.length === 1) return feelings[0].text;
    // "다"로 끝나는 단어를 자연스럽게 연결
    var parts = feelings.map(function (f, i) {
        if (i === feelings.length - 1) return f.text;
        // 중간 감정들은 "~고" 형태로
        var t = f.text;
        // "다"로 끝나면 "고"로 바꾸기
        if (/다$/.test(t)) {
            return t.replace(/다$/, '고');
        }
        return t;
    });
    return parts.join(' ');
}

// 일기 본문 자동 생성: 1단계-2 + 2단계-2 결과 합치기
function composeDiaryText(d) {
    var parts = d.baseParts;
    // 1단계-2 결과
    var s1 = parts.when + ' ' + parts.where + ' ' + parts.who + ' ' + parts.what + '.';
    // 2단계-2 결과 (감정 + 이유)
    var feelingText = joinFeelings(d.feelings);
    var s2 = '그래서 ' + feelingText + '.';
    var reasonClean = (d.reason || '').trim();
    if (!/[.!?。]$/.test(reasonClean)) reasonClean += '.';
    var s3 = '왜냐하면 ' + reasonClean;
    return s1 + ' ' + s2 + ' ' + s3;
}

        var rect = canvas.getBoundingClientRect();
        var sx = canvas.width / rect.width;
        var sy = canvas.height / rect.height;
        var clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        var clientY = e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
        return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
    }

        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var p = getPos(e, canvas);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = thickness;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

    }

    }, []);

                    ),
                    h("p", { className: "text-xl text-slate-500 font-bold mt-1" },
                        af ? h(React.Fragment, null, h("span", { className: af.text + " font-black" }, af.name), " 칸을 채워주세요")
                           : "공책에 쓰러 가봐요!"
                    )
                )
            ),

            // 통합 입력 박스 (입력방식 탭 위 + 필드탭 아래)
            activeField && h("div", { className: "flex-1 bg-white rounded-[2rem] shadow-xl border-4 " + af.border + " flex flex-col overflow-hidden min-h-0" },

                // ── 상단: 입력 방식 탭 ──
                h("div", { className: "flex shrink-0 border-b-2 border-slate-100" },
                    [
                        { mode: 'mic',    label: '🎤 녹음하기',      recommended: true },
                        { mode: 'typing', label: '✏️ 직접 쓰기' },
                        { mode: 'cards',  label: '📇 카드에서 고르기' }
                    ].map(function(opt) {
                        var isOn = inputMode === opt.mode;
                        return h("button", {
                            key: opt.mode,
                            onClick: (function(m){ return function(){ setInputMode(m); }; })(opt.mode),
                            className: "flex-1 py-5 px-3 font-black text-2xl transition border-b-4 -mb-0.5 " +
                                (isOn
                                    ? af.bg + " " + af.text + " " + af.border
                                    : "bg-white text-slate-400 border-transparent hover:bg-slate-50 hover:text-slate-600")
                        }, opt.label + (opt.recommended ? " ⭐" : ""));
                    })
                ),

                // ── 중단: 필드 탭 (1단계 카드 스타일 — 라벨 위, 값 크게, 둥글게) ──
                h("div", { className: "flex gap-2 px-4 py-3 border-b-2 border-slate-100 shrink-0" },
                    S3_FIELDS.map(function(k) {
                        var c = S3_COLORS[k];
                        var v = myParts[k];
                        var isActive = activeField === k;
                        return h(motion.button, {
                            key: k,
                            whileHover: { scale: 1.03, y: -2 },
                            whileTap: { scale: 0.97 },
                            onClick: (function(kk){ return function(){ setActiveField(kk); setInputMode('mic'); setTyping(''); }; })(k),
                            className: "flex-1 flex flex-col items-center gap-1 rounded-[1.25rem] border-4 py-3 px-2 shadow-md transition cursor-pointer " +
                                (v      ? c.bg + " " + c.border
                                       : isActive ? "bg-white " + c.border + " ring-4 ring-offset-1 " + c.ring
                                       : "bg-white border-slate-200 opacity-60")
                        },
                            h("span", { className: "text-xl font-black " + (v || isActive ? c.text : "text-slate-400") }, c.name),
                            h("span", {
                                className: "text-2xl font-black text-center leading-tight truncate max-w-full " +
                                    (v ? c.text : isActive ? c.text + " animate-pulse" : "text-slate-300")
                            }, v || (isActive ? "?" : "ㅡ"))
                        );
                    })
                ),

                // ── 하단: 입력 내용 ──
                h("div", { className: "flex-1 flex flex-col items-center justify-center gap-4 p-6 overflow-hidden min-h-0" },

                    // mic
                    inputMode === 'mic' && h("div", { className: "w-full flex flex-col gap-5 items-center" },
                        h("p", { className: "text-3xl font-black " + af.text + " text-center" },
                            micRec ? "🎙️ 듣고 있어요!" : af.name + "를 말해보세요"
                        ),
                        h("div", {
                            className: "w-full max-w-xl px-8 py-8 rounded-2xl text-4xl font-black border-4 min-h-[6.5rem] flex items-center justify-center text-center " +
                                (micRec ? "border-red-400 ring-4 ring-red-100 bg-red-50" : "border-slate-200 bg-yellow-50")
                        }, typing || h("span", { className: "text-slate-300 text-xl" }, "버튼을 누르고 말해보세요...")),
                        h("div", { className: "flex gap-4" },
                            micRec
                                ? h(React.Fragment, null,
                                    h("button", {
                                        onClick: function() {
                                            if (recRef.current) recRef.current.stop();
                                            var nextIdx = S3_FIELDS.indexOf(activeField) + 1;
                                            setMyParts(Object.assign({}, myParts));
                                            if (nextIdx < S3_FIELDS.length) { setActiveField(S3_FIELDS[nextIdx]); setMicRec(false); setTyping(''); }
                                            else { setActiveField(null); setMicRec(false); setTyping(''); setSubStep('review'); }
                                        },
                                        className: "px-6 py-4 rounded-2xl font-black text-xl bg-slate-200 text-slate-600"
                                    }, "⏭️ 건너뛰기"),
                                    h("button", {
                                        onClick: startMic,
                                        className: "px-8 py-4 rounded-2xl font-black text-2xl bg-emerald-500 text-white shadow-[0_5px_0_rgb(4,120,87)]"
                                    }, "🎤 다 말했어요!")
                                  )
                                : h(React.Fragment, null,
                                    h("button", { onClick: startMic, className: "px-10 py-4 rounded-3xl font-black text-2xl bg-red-500 text-white shadow-lg" },
                                        typing ? "🎤 다시 녹음" : "🎤 녹음 시작"),
                                    typing && h("button", {
                                        onClick: function(){ fillActive(typing); },
                                        className: "px-10 py-5 rounded-2xl font-black text-3xl bg-emerald-500 text-white shadow-[0_5px_0_rgb(4,120,87)]"
                                    }, "✅ 이걸로!")
                                  )
                        )
                    ),

                    // typing
                    inputMode === 'typing' && h("div", { className: "w-full max-w-lg flex flex-col gap-4 items-center" },
                        h("p", { className: "text-3xl font-black text-slate-600 text-center" }, af.name + "를 직접 써보세요"),
                        h("input", {
                            type: "text", value: typing,
                            onChange: function(e){ setTyping(e.target.value); },
                            onKeyDown: function(e){ if(e.key==='Enter' && typing.trim()) fillActive(typing); },
                            placeholder: af.name + "을(를) 직접 써보세요",
                            autoFocus: true,
                            className: "w-full px-6 py-6 text-4xl font-black rounded-2xl border-4 outline-none text-center bg-white " + af.border

                        typing.trim() && h("button", {
                            onClick: function(){ fillActive(typing); },

                    ),

                    // cards
                    inputMode === 'cards' && h("div", { className: "w-full min-h-0" },
                        h("div", { className: "flex flex-col gap-3 p-1" },
                            (function() {
                                var myCards = activeField === 'feeling'
                                    ? cards2
                                    : cards1.filter(function(c){ return c.key === activeField; });
                                var c = S3_COLORS[activeField];
                                return [
                                    myCards.length > 0 && h("div", { key: "my" },
                                        h("p", { className: "text-base font-black text-slate-500 mb-1.5 px-1" }, "⭐ 내가 모은 카드"),
                                        h("div", { className: "grid gap-2", style: { gridTemplateColumns: 'repeat(4, 1fr)' } },
                                            myCards.map(function(card, i) {
                                                var v = card.value || card.word || '';
                                                var e = card.emoji || '';
                                                return h(motion.button, {
                                                    key: 'my' + i,
                                                    whileHover: { scale: 1.03 }, whileTap: { scale: 0.97 },
                                                    onClick: (function(val){ return function(){ fillActive(val); }; })(v),
                                                    className: "px-3 py-3 rounded-2xl border-4 shadow-md font-black text-lg flex flex-row items-center justify-center gap-2 " + c.bg + " " + c.border + " " + c.text

                                                    h("span", { className: "leading-tight break-keep" }, v)
                                                );
                                            })

                                    ),
                                    h("div", { key: "def" },
                                        h("p", { className: "text-base font-black text-slate-400 mb-1.5 px-1" }, "📋 고를 수 있는 카드"),
                                        h("div", { className: "grid gap-2", style: { gridTemplateColumns: 'repeat(4, 1fr)' } },
                                            (function() {
                                                var myVals = (activeField === 'feeling' ? cards2 : cards1.filter(function(cc){ return cc.key === activeField; }))
                                                    .map(function(cc){ return cc.value || cc.word || ''; });
                                                return DEFAULT_CARDS[activeField].filter(function(card) {
                                                    return myVals.indexOf(card.value) === -1;
                                                }).map(function(card, i) {
                                                    var v = card.value || '';
                                                    var e = card.emoji || '';
                                                    return h(motion.button, {
                                                        key: 'def' + i,
                                                        whileHover: { scale: 1.03 }, whileTap: { scale: 0.97 },
                                                        onClick: (function(val){ return function(){ fillActive(val); }; })(v),
                                                        className: "px-3 py-3 rounded-2xl border-2 shadow-sm font-bold text-lg flex flex-row items-center justify-center gap-2 bg-white " + c.border + " " + c.text
                                                    },
                                                        e && h("span", { style: { fontSize: '1.6rem', lineHeight: 1, flexShrink: 0 } }, e),
                                                        h("span", { className: "leading-tight break-keep" }, v)
                                                    );
                                                });
                                            })()
                                        )
                                    )
                                ];
                            })()
                        )
                    )
                ),

                // (필드 탭은 위로 이동됨)
                null
            ),

            // 완료 시 review 버튼
            !activeField && h("div", { className: "flex justify-center shrink-0" },
                h("button", {
                    onClick: function(){ setSubStep('review'); },
                    className: "px-12 py-4 rounded-2xl text-2xl font-black bg-emerald-500 text-white shadow-[0_6px_0_rgb(4,120,87)] active:translate-y-1 active:shadow-none"
                }, "일기 확인하기 →")
            ),

            // 진행도 (하단)
            activeField && h("div", { className: "flex items-center justify-center gap-2 shrink-0" },
                S3_FIELDS.map(function(k, i) {
                    var done = !!myParts[k];
                    var active = activeField === k;
                    return h("div", { key: i, className: "w-4 h-4 rounded-full " + (done ? "bg-emerald-500" : active ? "bg-emerald-500 scale-125" : "bg-slate-200") });
                }),
                h("span", { className: "ml-2 text-base font-black text-slate-600" }, fillCount + " / 5")
            )
        );
    }

    // ───── review ─────
    else if (subStep === 'review') {
        content = h("div", { className: "flex-1 flex flex-col p-3 gap-3 min-h-0 overflow-hidden" },
            h("div", { className: "flex items-start gap-3 shrink-0" },
                h(PencilFairy, { mini: true }),
                h("div", { className: "bg-white px-6 py-3 rounded-3xl shadow-xl border-2 border-emerald-200 mt-4" },
                    h("h2", { className: "text-2xl font-black text-emerald-700" }, "✅ 일기가 완성됐어요!"),
                    h("p", { className: "text-xl text-slate-500 font-bold mt-1" }, "선생님께 자동으로 보내지고 있어요 📮")
                )
            ),
            h("div", { className: "flex-1 flex items-center justify-center min-h-0 overflow-hidden" },
                h("div", { className: "paper rounded-[2.5rem] shadow-2xl border-[6px] border-amber-200 p-7 max-w-3xl w-full" },
                    h("div", { className: "flex justify-between items-center pb-3 border-b-4 border-double border-amber-300 mb-4" },
                        h("span", { className: "text-lg font-black text-amber-700" }, "📅 " + todayStr() + " " + todayDay()),
                        h("span", { className: "text-lg font-black text-amber-700" }, "✏️ " + data.studentName)
                    ),
                    h("div", { className: "flex flex-wrap items-end gap-3 justify-center mb-4" },
                        S3_FIELDS.map(function(k) {
                            var c = S3_COLORS[k];
                            var v = myParts[k];
                            if (!v) return null;
                            return h("div", { key: k, className: "flex flex-col items-center gap-1" },
                                h("span", { className: "text-sm font-black " + c.text }, c.name),
                                h("span", { className: "px-4 py-2 rounded-2xl text-2xl font-black shadow-md border-4 " + c.bg + " " + c.text + " " + c.border }, v)
                            );
                        })
                    )
                )
            ),
            h("div", { className: "flex justify-center gap-3 shrink-0" },
                h("button", {
                    onClick: function(){ restart(); },
                    className: "px-7 py-4 bg-slate-100 text-slate-600 rounded-2xl text-xl font-black border-2 border-slate-200 hover:bg-slate-200"
                }, "← 다시 쓰기"),
                h(motion.div, {
                    animate: { scale: [1, 1.05, 1] },
                    transition: { repeat: Infinity, duration: 1.2 },
                    className: "px-12 py-4 bg-emerald-500 text-white rounded-2xl text-xl font-black shadow-[0_6px_0_rgb(4,120,87)] flex items-center gap-2"
                }, "📮 선생님께 보내는 중...")
            )
        );
    }
    // ───── submit (제출 애니메이션) ─────
    else if (subStep === 'submit') {
        content = h("div", { className: "flex-1 flex flex-col items-center justify-center p-4 gap-4 overflow-hidden" },
            h(motion.div, {
                initial: { y: 0, scale: 1, opacity: 1 },
                animate: { y: -200, scale: 0.5, opacity: 0 },
                transition: { duration: 1.2, ease: "easeInOut" },
                className: "text-9xl"
            }, "📮"),
            h(motion.h2, {
                initial: { opacity: 0 },
                animate: { opacity: 1 },
                transition: { delay: 0.6 },
                className: "text-4xl font-black text-emerald-600"
            }, "보내는 중...")
        );
    }

    // ───── done ─────
    else if (subStep === 'done') {
        content = h("div", { className: "flex flex-col items-center justify-center h-full p-8 gap-5" },
            h(motion.div, {
                initial: { scale: 0, rotate: -180 },
                animate: { scale: 1, rotate: 0 },
                transition: { type: "spring", stiffness: 120 },
                className: "text-9xl"
            }, "🎉"),
            h(motion.h2, {
                initial: { y: 20, opacity: 0 },
                animate: { y: 0, opacity: 1 },
                transition: { delay: 0.2 },
                className: "text-5xl font-black text-emerald-600"
            }, gasConnected() ? "선생님께 도착했어요!" : "일기를 완성했어요!"),
            h("p", { className: "text-2xl font-bold text-slate-600 text-center" },
                "오늘 일기를 모두 완성했어요!", h("br", null),
                "정말 멋진 하루였어요! 🌟"
            ),
            h("div", { className: "bg-emerald-50 px-6 py-3 rounded-full border-2 border-emerald-200 flex items-center gap-3" },
                h("span", { className: "text-3xl" }, "✅"),
                h("span", { className: "text-xl font-black text-emerald-700" }, "「" + (todayStr() + ' ' + todayDay()) + "」 — 완료")
            ),
            // 데모 모드 안내
            !gasConnected() && h("div", { className: "bg-amber-50 border-2 border-amber-200 rounded-2xl px-6 py-4 text-center max-w-sm" },
                h("p", { className: "text-base font-bold text-amber-700" },
                    "💡 선생님이 구글 시트를 연결하면", h("br", null),
                    "일기가 시트에 저장돼요."
                )
            ),
            h("button", {
                onClick: function() { if (props.onBack) props.onBack(); else restart(); },
                className: "px-16 py-5 bg-emerald-500 text-white rounded-2xl text-3xl font-black shadow-[0_8px_0_rgb(4,120,87)] active:translate-y-1 active:shadow-none mt-2"
            }, "← 메뉴로 돌아가기")
        );
    }

    return h("div", { className: "w-full bg-[#F0F7FF] flex flex-col overflow-hidden min-h-0", style: { height: "100dvh" } },
        h(Tutorial, {
            storageKey: 'tutorial_s3_v5',
            accentColor: 'emerald',
            steps: [
                {
                    emoji: '📔', title: '오늘 일기를 써볼까요?',
                    desc: '오늘 있었던 일을 5개 칸에 채우면 일기가 완성돼요!\n어떻게 하는지 함께 알아봐요.',
                    action: 'none',
                    preview: function() {
                        return h('div', { style: { display:'flex', gap:'0.6rem', justifyContent:'center', flexWrap:'wrap' } },
                            [
                                { label:'언제',  bg:'#fef3c7', border:'#f59e0b', text:'#92400e', emoji:'⏰' },
                                { label:'어디서',bg:'#dbeafe', border:'#3b82f6', text:'#1e3a8a', emoji:'📍' },
                                { label:'누구와',bg:'#d1fae5', border:'#10b981', text:'#065f46', emoji:'👥' },
                                { label:'무엇을',bg:'#fee2e2', border:'#ef4444', text:'#991b1b', emoji:'🎯' },
                                { label:'마음',  bg:'#ede9fe', border:'#a855f7', text:'#6b21a8', emoji:'💜' }
                            ].map(function(c) {
                                return h('div', { key:c.label, style:{ background:c.bg, border:'3px solid '+c.border, borderRadius:'1.25rem', padding:'0.8rem 1rem', display:'flex', flexDirection:'column', alignItems:'center', gap:'0.3rem', minWidth:'90px' } },
                                    h('span', { style:{ fontSize:'2rem' } }, c.emoji),
                                    h('span', { style:{ fontWeight:900, fontSize:'1.2rem', color:c.text } }, c.label)
                                );
                            })
                        );
                    }
                },
                {
                    emoji: '🎤', title: '3가지 방법으로 채울 수 있어요!',
                    desc: '각 칸은 3가지 방법 중 하나로 채울 수 있어요.\n마음에 드는 방법을 골라봐요!',
                    action: 'tap',
                    options: [
                        { label: '🎤 녹음하기',        emoji: '',  bg: '#fef2f2', color: '#dc2626', value: 'rec' },
                        { label: '✏️ 직접 입력하기',   emoji: '',  bg: '#fff7ed', color: '#c2410c', value: 'type' },
                        { label: '📇 카드 선택하기',    emoji: '',  bg: '#eff6ff', color: '#1d4ed8', value: 'card' }
                    ]
                },
                {
                    emoji: '🎤', title: '방법 1: 녹음하기',
                    desc: '마이크 버튼을 누르고\n말로 답을 말해봐요!',
                    action: 'none',
                    preview: function() {
                        return h('div', { style:{ display:'flex', flexDirection:'column', alignItems:'center', gap:'1rem' } },
                            h('div', { style:{ background:'#fef2f2', border:'3px solid #fca5a5', borderRadius:'1.5rem', padding:'0.75rem 1.5rem', fontSize:'1.3rem', fontWeight:700, color:'#991b1b' } },
                                '오늘 점심시간에 교실에서 친구랑 ...'
                            ),
                            h('div', { style:{ background:'#ef4444', color:'white', padding:'0.75rem 2rem', borderRadius:'1rem', fontWeight:900, fontSize:'1.5rem', boxShadow:'0 5px 0 #991b1b' } }, '🎤 녹음 시작'),
                            h('p', { style:{ fontSize:'1.1rem', color:'#94a3b8', fontWeight:700 } }, '말하면 자동으로 글로 바뀌어요!')
                        );
                    }
                },
                {
                    emoji: '✏️', title: '방법 2: 직접 입력하기',
                    desc: '키보드로 직접\n글자를 써봐요!',
                    action: 'type',
                    placeholder: '예) 친구랑 밥을 먹었어요',
                    examples: ['그네를 탔어요', '책을 읽었어요', '달리기를 했어요']
                },
                {
                    emoji: '📇', title: '방법 3: 카드 선택하기',
                    desc: '1단계에서 모은 카드 중에서\n원하는 카드를 골라봐요!',
                    action: 'tap',
                    options: [
                        { label: '오늘 아침에',    bg: '#fef3c7', color: '#92400e', value: 'c1' },
                        { label: '학교에서',       bg: '#dbeafe', color: '#1e3a8a', value: 'c2' },
                        { label: '친구랑',         bg: '#d1fae5', color: '#065f46', value: 'c3' }
                    ]
                },
                {
                    emoji: '📮', title: '다 채웠으면 보내요!',
                    desc: '5개 칸을 모두 채우면\n"선생님께 보내기" 버튼을 눌러요!',
                    action: 'tap',
                    options: [
                        { label: '📮 선생님께 보내기', bg: '#10b981', color: 'white', value: 'send' },
                        { label: '← 다시 쓰기',        bg: '#f1f5f9', color: '#64748b', value: 'redo' }
                    ]
                },
                {
                    emoji: '🎉', title: '준비 완료! 일기를 써봐요!',
                    desc: '녹음·입력·카드 중 편한 방법으로\n오늘 일기를 완성해봐요. 화이팅!',
                    action: 'none'
                }
            ]
        }),
        h(StageHeader, {
            currentKey: 's3',
            subStep: subStep,
            onChangeStage: props.onChangeStage,
            onGoHome: props.onBack,
            rightSlot: h("span", { className: "px-4 py-2 bg-white border-2 border-emerald-300 rounded-2xl font-black text-base text-emerald-700" },
                subStep === 'start' ? "안내" :
                subStep === 'compose' ? "1) 제목·본문·그림" :
                subStep === 'review' ? "2) 미리보기" :
                subStep === 'submit' ? "3) 보내는 중" :
                "끝"
            )
        }),
        h("main", { className: "flex-1 overflow-hidden min-h-0 flex flex-col" }, content)
    );
}
